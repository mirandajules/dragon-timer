<style>
:root{
  /* Breathe design system, Day theme (semantic tokens) */
  --surface:#FFF9F2; --surface-raised:#FFFFFF; --surface-sunken:#F6EEE4; --line:#E9DED1;
  --ink:#2B2420; --ink-muted:#6B5F55;
  --brand:#FF7A2E; --on-brand:#2B1405; --brand-text:#A9420A; --brand-soft:#FFE7D6;
  --sunshine:#FFC845;
  --radius-full:9999px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
  --shadow-sm:0 1px 2px #2b242010,0 2px 6px #2b242014;
  --focus-ring:0 0 0 2px #FFF9F2,0 0 0 4px #2459C7;
  --font-sans:"Figtree",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#cfeefb;color:var(--ink);font-family:var(--font-sans);font-weight:600;-webkit-tap-highlight-color:transparent}
.app{
  --H:clamp(170px,min(50vh,66vw),620px);   /* height of the scene at the bottom */
  position:relative;
  overflow:hidden;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;

.controls{position:relative;z-index:1;width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:var(--space-4)}
.presets{display:flex;gap:var(--space-3);width:100%}
.preset{
  flex:1 1 0;min-width:0;min-height:64px;padding:0 var(--space-2);
  font:inherit;font-size:clamp(20px,3.2vh,26px);font-weight:700;white-space:nowrap;
  border:0;border-radius:var(--radius-full);background:var(--surface-raised);color:var(--ink);
  box-shadow:var(--shadow-sm);
}
.preset[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-text);box-shadow:inset 0 0 0 3px var(--brand-text)}
.preset:disabled{cursor:default;opacity:.55}
.go{
  width:100%;min-height:72px;
  font:inherit;font-size:clamp(24px,3.8vh,32px);font-weight:800;letter-spacing:.01em;
  border:0;border-radius:var(--radius-full);
  background:var(--brand);color:var(--on-brand);
  box-shadow:0 6px 16px -4px #a9420a66;
}
.go.stop{background:var(--surface-raised);color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink),var(--shadow-sm)}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .2s ease-out,box-shadow .2s ease-out,background-color .2s}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible{outline:2px solid transparent;box-shadow:var(--focus-ring)}
.go.stop:focus-visible{box-shadow:inset 0 0 0 3px var(--ink),var(--focus-ring)}
.clock{
  position:relative;z-index:1;margin:0;
  font-size:clamp(72px,min(24vw,15vh),190px);line-height:1;font-weight:800;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink);
  text-shadow:0 0 18px #fff9f2,0 0 6px #fff9f2;
}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Scene = the background, anchored to the bottom */
.scene{position:absolute;left:0;right:0;bottom:0;height:var(--H);display:flex;justify-content:center;pointer-events:none;z-index:0}
#scene{display:block;height:100%;width:calc(var(--H) * 5 / 3);overflow:visible}
#g-dragon{transform:translate(204px,450px) scale(-.85,.85)}
#g-knight{transform:translate(652px,450px) scale(-.9,.9)}

/* Portrait: characters close together */
@media (max-aspect-ratio:1/1){
  .app{--H:clamp(190px,calc(100vw * .72),640px)}
  #g-dragon{transform:translate(272px,450px) scale(-.85,.85)}
  #g-knight{transform:translate(566px,450px) scale(-.9,.9)}
}
/* Short landscape (phones on their side): same order, tighter, characters at the sides */
@media (orientation:landscape) and (max-height:540px){
  .app{--H:clamp(150px,47vh,620px);gap:10px;padding-top:10px}
  .preset{min-height:64px;font-size:21px}
  .go{min-height:64px;font-size:26px}
  .clock{font-size:clamp(48px,15vh,72px)}
  #g-dragon{transform:translate(190px,450px) scale(-.85,.85)}
  #g-knight{transform:translate(670px,450px) scale(-.9,.9)}
}

/* ---------- Scene ---------- */
#scene image,#scene .face,#scene .puffs{opacity:0;transition:opacity .3s}
#scene image.bg{opacity:1}
#scene[data-dragon="idle"] .d-idle,
#scene[data-dragon="smoke"] .d-smoke,
#scene[data-dragon="fire"] .d-fire,
#scene[data-dragon="fire"] .d-flame,
#scene[data-knight="idle"] .k-idle,
#scene[data-knight="worried"] .k-worried,
#scene[data-knight="soot"] .k-soot{opacity:1}
/* soot fades in slowly; everything snaps back quickly on Stop */
#scene[data-knight="soot"] .k-idle,
#scene[data-knight="soot"] .k-worried,
#scene[data-knight="soot"] .k-soot{transition-duration:1.2s}
#scene[data-dragon="idle"][data-face="1"] .df1,
#scene[data-dragon="idle"][data-face="2"] .df2,
#scene[data-dragon="idle"][data-face="3"] .df3,
#scene[data-knight="idle"][data-face="2"] .kf2,
#scene[data-knight="idle"][data-face="3"] .kf3{opacity:1}
#scene .face{transition-duration:.15s}
#scene[data-dragon="smoke"] .puffs{opacity:1}

.flame-in{transform:rotate(-14deg) scale(.15);transition:transform .2s}
#scene[data-dragon="fire"] .flame-in{transform:rotate(-14deg) scale(1);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}

.rock-d{animation:rock 5.2s ease-in-out infinite}
.rock-k{animation:rock 4.4s ease-in-out -1.7s infinite reverse}
.breathe-d{animation:breathe 3.2s ease-in-out infinite}
.breathe-k{animation:breathe 3.2s ease-in-out -1.3s infinite}
.flicker{animation:flicker .42s ease-in-out infinite alternate}
.flicker2{animation:flicker2 .31s ease-in-out infinite alternate}
.puff{animation:puff 2.2s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.puff:nth-child(2){animation-delay:-.55s}
.puff:nth-child(3){animation-delay:-1.1s}
.puff:nth-child(4){animation-delay:-1.65s}

@keyframes rock{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.014)}}
@keyframes flicker{from{transform:scale(1.34,1.12) skewY(-2deg)}to{transform:scale(1.47,1.26) skewY(3deg)}}
@keyframes flicker2{from{transform:scale(1,1)}to{transform:scale(1.04,.93)}}
@keyframes puff{
  0%{transform:translate(0,0) scale(.5);opacity:0}
  15%{opacity:.95}
  100%{transform:translate(-70px,-95px) scale(1.7);opacity:0}
}

@media (prefers-reduced-motion:reduce){
  .rock-d,.rock-k,.breathe-d,.breathe-k,.flicker,.flicker2,.puff{animation-duration:8s}
  .puff:nth-child(2){animation-delay:-2s}
  .puff:nth-child(3){animation-delay:-4s}
  .puff:nth-child(4){animation-delay:-6s}
  button{transition:none}
}
</style>
</head>
<body>
<main class="app">
  <div class="controls">
    <div class="presets" role="group" aria-label="Timer length">
      <button type="button" class="preset" data-seconds="30" aria-pressed="true">30 s</button>
      <button type="button" class="preset" data-seconds="60" aria-pressed="false">1 min</button>
      <button type="button" class="preset" data-seconds="120" aria-pressed="false">2 min</button>
    </div>
    <button type="button" class="go" id="go">Start</button>
  </div>
  <div class="clock" id="clock" role="timer" aria-live="off" aria-label="Time left">00:30</div>

  <div class="scene">
    <svg id="scene" viewBox="0 0 800 480" role="img" data-dragon="idle" data-knight="idle" data-face="0"
         aria-label="A friendly pink dragon sits on the left of a grassy hill, facing a little knight with a shield and sword on the right, under a soft blue sky with clouds.">


      <!-- knight: local origin is the middle of his feet -->

<script>
(function () {
  'use strict';
  var scene = document.getElementById('scene');
  var clock = document.getElementById('clock');
  var go = document.getElementById('go');
  var announce = document.getElementById('announce');
  var presets = Array.prototype.slice.call(document.querySelectorAll('.preset'));

  var FACE_EVERY = 15;   // seconds between expression changes
  var FACES = 4;         // happy, surprised, wink, silly
  var SMOKE_AT = 15;     // smoke for the last 15 seconds

  // Single source of truth. status: 'idle' | 'running' | 'finished'
  var state = { preset: 30, status: 'idle', startedAt: 0 };
  var endTimer = 0;
  var RESET_AFTER = 2000;   // ms after zero before the button flips back to Start
  var shown = {};
  var raf = 0;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(s) { return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }

  // Everything on screen is derived from state + the current time.
  function derive(now) {
    var st = state.status;
    var over = st === 'finished';
    var elapsed = st === 'idle' ? 0 : Math.min((now - state.startedAt) / 1000, state.preset);
    var remaining = state.preset - elapsed;
    var face = st === 'idle' ? 0
      : Math.floor(Math.min(elapsed, state.preset - 0.001) / FACE_EVERY) % FACES;
    return {
      clock: fmt(Math.ceil(remaining)),
      face: String(face),
      dragon: over ? 'fire' : (st === 'running' && remaining <= SMOKE_AT ? 'smoke' : 'idle'),
      knight: over ? 'soot' : (face === 1 ? 'worried' : 'idle'),
      running: st !== 'idle',
      preset: state.preset
    };
  }

  function render() {
    var v = derive(performance.now());
    if (v.clock !== shown.clock) clock.textContent = v.clock;
    if (v.face !== shown.face) scene.setAttribute('data-face', v.face);
    if (v.dragon !== shown.dragon) scene.setAttribute('data-dragon', v.dragon);
    if (v.knight !== shown.knight) scene.setAttribute('data-knight', v.knight);
    if (v.running !== shown.running) {
      go.textContent = v.running ? 'Stop' : 'Start';
      go.classList.toggle('stop', v.running);
      presets.forEach(function (b) { b.disabled = v.running; });
    }
    if (v.preset !== shown.preset) {
      presets.forEach(function (b) {
        b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-seconds')) === v.preset));
      });
    }
    shown = v;
  }

  function frame() {
    raf = 0;
    if (state.status !== 'running') return;
    if (performance.now() - state.startedAt >= state.preset * 1000) {
      state.status = 'finished';       // fire + soot show for 2 s
      endTimer = setTimeout(reset, RESET_AFTER);   // back to the idle scene and a Start button
      announce.textContent = 'Time’s up!';
    }
    render();
    if (state.status === 'running') raf = requestAnimationFrame(frame);
  }

  function start() {
    clearTimeout(endTimer);
    state.status = 'running';
    state.startedAt = performance.now();
    announce.textContent = '';
    render();
    if (!raf) raf = requestAnimationFrame(frame);
  }

  function reset() {
    clearTimeout(endTimer);
    state.status = 'idle';
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    announce.textContent = '';
    render();
  }

  go.addEventListener('click', function () {
    if (state.status === 'idle') start(); else reset();
  });

  presets.forEach(function (b) {
    b.addEventListener('click', function () {
      if (state.status !== 'idle') return;
      state.preset = Number(b.getAttribute('data-seconds'));
      render();
    });
  });

  // Catch up straight away when the tab or screen comes back.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.status === 'running' && !raf) frame();
    else if (!document.hidden && state.status === 'running') render();
  });

  render();
})();
</script>
