<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon timer</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#BFE3F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@900&display=swap">
<style>
:root{
  --ink:#2A1D18;
  --card-bg:rgba(255,255,255,.62);
  --card-edge:rgba(255,255,255,.85);
  --card-bg-selected:rgba(255,234,222,.82);
  --card-edge-selected:#FC5000;
  --focus:#FC5000;
  --focus-gap:#FFFFFF;
  --card-shadow:0 12px 28px rgba(41,56,84,.16),0 2px 6px rgba(41,56,84,.08);
  --radius-card:24px;
  /* Design target is 390 x 844 (portrait). --w is the column width; --u is "1 design point". */
  --w:min(100vw,520px,calc(100vh * 390 / 844));
  --u:calc(var(--w) / 390);
}
@supports (height:100dvh){:root{--w:min(100vw,520px,calc(100dvh * 390 / 844))}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#FFFFFF url(design/background-clouds.webp) center top / cover no-repeat;
  color:var(--ink);
  font-family:'Grandstander','Inter',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
.screen{
  width:var(--w);
  height:100vh;height:100dvh;
  margin:0 auto;
  display:flex;flex-direction:column;
  overflow:hidden;
}
.cards{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:calc(var(--u) * 12);
  padding:calc(max(env(safe-area-inset-top,0px),var(--u) * 59) + var(--u) * 77) calc(var(--u) * 16) 0;
}
.card{width:100%;padding:0;border:0;background:none;cursor:pointer;font:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.card:focus-visible{outline:none}
.card__face{
  display:flex;align-items:center;justify-content:center;
  width:100%;aspect-ratio:1;
  border-radius:calc(var(--u) * 24);
  border:2px solid var(--card-edge);
  background:var(--card-bg);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);
  backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:var(--card-shadow);
  transition:background-color 120ms ease-out,border-color 120ms ease-out,box-shadow 120ms ease-out,transform 120ms ease-out;
}
.card[aria-pressed="true"] .card__face{background:var(--card-bg-selected);border-color:var(--card-edge-selected)}
.card:active .card__face{transform:scale(.96)}
.card:focus-visible .card__face{box-shadow:0 12px 28px rgba(41,56,84,.16),0 0 0 2px var(--focus-gap),0 0 0 4px var(--focus)}
.card svg{width:calc(var(--u) * 72);height:calc(var(--u) * 72);display:block}

.timer-area{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding-top:calc(var(--u) * 12)}
.timer{
  font-weight:900;
  font-size:calc(var(--u) * 80);line-height:1;
  letter-spacing:.01em;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.stage{
  width:var(--w);height:var(--w);flex-shrink:0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 14%);
}
.stage{position:relative}
/* Two stacked videos: one visible, one primed off-screen. A swap is a hard cut, never a reload. */
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;mix-blend-mode:multiply;opacity:0}
.stage video.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Landscape / wide screens: show the portrait design as a centred column on plain paper,
   so the clips' off-white background never shows a square edge against the sky. */
@media (min-aspect-ratio:1/1){
  body{background:#F6F8F2}
  .screen{background:#FFFFFF url(design/background-clouds.webp) center top / cover no-repeat}
}
@media (prefers-reduced-motion:reduce){.card__face{transition:none}}
</style>

  };

  var announce = document.getElementById('announce');

  var ticker = 0;
  var wakeLock = null;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(s) { return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }

  // ---------------------------------------------------------------
  // Clip cache: every clip is downloaded once into memory (a blob), so
  // starting a clip never waits on the network. Order = most needed first.

  var blobs = {};

    var order = [STANDBY.clip];
    Object.keys(TASKS).forEach(function (k) { order.push(TASKS[k].intro); });
    Object.keys(TASKS).forEach(function (k) { order.push(TASKS[k].loop); });
    (function next(i) {
      if (i >= order.length || !window.fetch || !window.URL) return;
      if (order[i].indexOf('data:') === 0) return next(i + 1);   // embedded build: already in memory
      fetch(encodeURI(order[i])).then(function (r) { return r.ok ? r.blob() : null; })
        .then(function (b) { if (b) blobs[order[i]] = URL.createObjectURL(b); })
        .catch(function () {})
        .then(function () { next(i + 1); });
    })(0);
  })();

  // ---------------------------------------------------------------
  // Two-video player. `visible` shows the current clip; the other element is
  // primed with the next clip (first frame decoded, paused). A swap starts
  // the primed one and cuts to it only when its first frame is on screen,
  // so there is never a blank or half-loaded frame.
  // ---------------------------------------------------------------
  var vids = [document.getElementById('v0'), document.getElementById('v1')];
  var visible = vids[0];
  var token = 0;                       // bumps on every request; stale callbacks give up

  function hidden() { return visible === vids[0] ? vids[1] : vids[0]; }

  function prime(el, clip, loop, poster) {
    el.loop = loop;
    el.poster = poster || '';
    return new Promise(function (resolve) {
      if (el.getAttribute('data-clip') === clip && el.readyState >= 2) {
        try { el.pause(); el.currentTime = 0; } catch (e) {}
        resolve(); return;
      }
      var done = false;
      function finish() {
        if (done) return; done = true;
        el.removeEventListener('loadeddata', finish);
        el.removeEventListener('error', finish);
        try { el.pause(); el.currentTime = 0; } catch (e) {}   // primed = first frame, not playing
        resolve();
      }
      el.addEventListener('loadeddata', finish);
      el.addEventListener('error', finish);
      el.setAttribute('data-clip', clip);
      el.pause();
      el.src = srcFor(clip);
      el.load();
    });
  }

  function cut(el, mine) {
    if (mine !== token || el === visible) return;
    var old = visible;
    el.classList.add('on');
    old.classList.remove('on');
    visible = el;
    try { old.pause(); } catch (e) {}
    if (state.phase === 'intro') watchEnd(el);
  }

  // Cut to the loop on the intro's final frames instead of waiting for 'ended',
  // so the held last frame is as short as possible.
  function toLoop() {
    if (state.phase !== 'intro' || !state.task) return;
    var t = TASKS[state.task];
    state.phase = 'loop';
    switchTo(t.loop, true, t.poster);   // primed during the intro, so this starts at once
  }
  function watchEnd(el) {
    if (!('requestVideoFrameCallback' in el)) return;
    var mine = token;
    (function step() {
      el.requestVideoFrameCallback(function (now, meta) {
        if (mine !== token || el !== visible) return;
        if (el.duration - meta.mediaTime <= 0.1) toLoop(); else step();
      });
    })();
  }

  // Start the (primed) element and cut to it once it has painted a frame.
  function reveal(el) {
    var mine = token;
    var shown = false;
    function show() { if (shown) return; shown = true; cut(el, mine); }
    var p = el.play();
    if (p && p.catch) p.catch(function () { show(); });
    if ('requestVideoFrameCallback' in el) el.requestVideoFrameCallback(show);
    else el.addEventListener('playing', show, { once: true });
    setTimeout(show, 500);             // safety net
  }

  // Prime the idle element with `clip`, then cut to it.
  function switchTo(clip, loop, poster) {
    var mine = ++token;
    var el = hidden();
    prime(el, clip, loop, poster).then(function () {
      if (mine !== token) return;
      reveal(el);
    });
  }

  // Prime the idle element with the next clip without showing it.
  function prepare(clip, loop, poster) { prime(hidden(), clip, loop, poster); }

  vids.forEach(function (v) {
    v.addEventListener('ended', function () {
      if (v === visible) toLoop();        // fallback if the frame callback never fired
    });
  });

  // ---- wake lock (keeps the screen on while a task runs) ----
  function lock() {
    if (!('wakeLock' in navigator) || wakeLock) return;
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l;
      l.addEventListener('release', function () { if (wakeLock === l) wakeLock = null; });
      if (state.task === null) unlock();
    }).catch(function () {});
  }
  function unlock() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }

  function setTimer(text) { if (timerEl.textContent !== text) timerEl.textContent = text; }
  function render() {
    cards.forEach(function (c) {
      c.setAttribute('aria-pressed', String(c.getAttribute('data-task') === state.task));
    });
  }

  // ---- state changes ----
  function goStandby(message) {
    clearInterval(ticker); ticker = 0;
    state = { phase: 'standby', task: null, startedAt: 0, duration: 0 };
    setTimer('00:00');
    render();
    unlock();
    switchTo(STANDBY.clip, true, STANDBY.poster);
    if (message) announce.textContent = message;
  }

  function startTask(id) {
    var t = TASKS[id];
    clearInterval(ticker);
    state = { phase: 'intro', task: id, startedAt: Date.now(), duration: t.seconds };
    setTimer(fmt(t.seconds));
    render();
    lock();
    switchTo(t.intro, false, t.poster);
    // As soon as the intro is on screen, get the loop ready on the idle video.
    var mine = token;
    var wait = setInterval(function () {
      if (mine !== token) { clearInterval(wait); return; }
      if (visible.getAttribute('data-clip') === t.intro && !visible.paused) {
        clearInterval(wait);
        prepare(t.loop, true, t.poster);
      }
    }, 50);
    announce.textContent = t.name + ' started';
    ticker = setInterval(tick, 200);
  }

  function tick() {
    var elapsed = (Date.now() - state.startedAt) / 1000 * speed;
    var remaining = Math.max(0, state.duration - elapsed);
    setTimer(fmt(Math.ceil(remaining)));
    if (remaining <= 0) goStandby('All done!');
  }

  cards.forEach(function (c) {
    c.addEventListener('click', function () {
      var id = c.getAttribute('data-task');
      if (state.task === id) goStandby('Stopped'); else startTask(id);
    });
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    if (state.task) { tick(); lock(); }
    var p = visible.play(); if (p && p.catch) p.catch(function () {});
  });

  // First clip: standby, on the visible element.
  visible.setAttribute('data-clip', STANDBY.clip);
  visible.loop = true;
  visible.poster = STANDBY.poster;
  visible.src = srcFor(STANDBY.clip);
  var first = visible.play(); if (first && first.catch) first.catch(function () {});
  goStandbyInit();
  function goStandbyInit() { setTimer('00:00'); render(); }
})();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
